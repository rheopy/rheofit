# Build the browser fit app (WebAssembly) and deploy it to GitHub Pages.
name: deploy-app

on:
  push:
    branches: [master]
    paths:
      - "app/**"
      - ".github/workflows/deploy-app.yml"
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/deploy-app.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5

      - name: Install marimo
        run: pip install marimo

      - name: Export app to WebAssembly
        run: marimo export html-wasm app/fit_app.py -o dist --mode run

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
