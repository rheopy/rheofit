# Verify the docs build on every push and pull request.
name: docs

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r docs/requirements.txt
          pip install -e .

      - name: Export interactive notebooks
        run: python docs/export_interactive.py

      - name: Build docs
        run: sphinx-build -W -b html docs docs/_build/html
