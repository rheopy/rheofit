[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rheofit"
version = "1.0.0"
description = "Fit flow curves (viscosity vs shear rate) to physically-based rheological models and quantify material properties."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
]

[project.optional-dependencies]
pptx = ["python-pptx"]

[project.scripts]
rheofit = "rheofit.cli:main"

[dependency-groups]
dev = [
    "ipykernel",
    "python-pptx",
]

[tool.uv]
# `uv sync` installs the project itself (editable) plus the dev group, so a
# fresh clone gets a ready-to-use environment with notebook + pptx support.
default-groups = ["dev"]

[tool.hatch.build.targets.wheel]
packages = ["rheofit"]
