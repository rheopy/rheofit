# Read the Docs configuration.
# Connect the repo at https://readthedocs.org/dashboard/ -> Import a Project;
# this file then controls every build.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  # System libraries for the headless Chromium that the offline WASM
  # export (marimo --offline) needs; list from Playwright's own dependency
  # data for ubuntu-24.04/chromium.
  apt_packages:
    - libasound2t64
    - libatk-bridge2.0-0t64
    - libatk1.0-0t64
    - libatspi2.0-0t64
    - libcairo2
    - libcups2t64
    - libdbus-1-3
    - libdrm2
    - libgbm1
    - libglib2.0-0t64
    - libnspr4
    - libnss3
    - libpango-1.0-0
    - libx11-6
    - libxcb1
    - libxcomposite1
    - libxdamage1
    - libxext6
    - libxfixes3
    - libxkbcommon0
    - libxrandr2
  jobs:
    pre_build:
      # headless browser for the offline WASM export, then export the
      # marimo explorers before Sphinx runs
      - python -m playwright install chromium
      - python docs/export_interactive.py

sphinx:
  configuration: docs/conf.py

python:
  install:
    - requirements: docs/requirements.txt
    - method: pip
      path: .
