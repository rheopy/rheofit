# Read the Docs configuration.
# Connect the repo at https://readthedocs.org/dashboard/ -> Import a Project;
# this file then controls every build.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    pre_build:
      # export marimo wasm explorers before Sphinx runs
      - python docs/export_interactive.py

sphinx:
  configuration: docs/conf.py

python:
  install:
    - requirements: docs/requirements.txt
    - method: pip
      path: .
